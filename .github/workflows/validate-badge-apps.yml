name: Validate badge apps

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Test badge tools
        run: python -m unittest discover -s .github/skills/badge-app-builder/tests -v

      - name: Compile Python sources
        run: python -m compileall -q badge .github/skills/badge-app-builder

      - name: Validate shared example apps
        run: python .github/skills/badge-app-builder/scripts/validate_submissions.py badge/apps

      - name: Validate team submissions
        run: python .github/skills/badge-app-builder/scripts/validate_submissions.py
